<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snippets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0F16;
    --panel:#161922;
    --panel-2:#1D212C;
    --line:#2A2F3D;
    --line-soft:#20242F;
    --text:#E6E8F0;
    --muted:#868DA3;
    --muted-2:#565C70;
    --accent:#7C9EFF;
    --accent-soft:rgba(124,158,255,.14);
    --mint:#5FE3B3;
    --amber:#F2A65A;
    --danger:#F2836A;
    --radius:14px;
    --radius-sm:8px;
    --font-mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
    --font-sans:'Inter', system-ui, -apple-system, sans-serif;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% -10%, rgba(124,158,255,.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
  }

  .page{
    max-width:760px;
    margin:0 auto;
    padding:28px 24px 80px;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:32px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    display:flex;
    align-items:center;
    justify-content:center;
    width:30px;
    height:30px;
    border-radius:8px;
    background:var(--accent-soft);
    color:var(--accent);
    font-family:var(--font-mono);
    font-weight:700;
    font-size:13px;
  }
  .brand-name{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:16px;
    letter-spacing:.2px;
  }
  .logout-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    font-family:var(--font-sans);
    font-size:13px;
    font-weight:500;
    padding:8px 14px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .logout-btn:hover{ border-color:var(--muted-2); color:var(--text); }
  .logout-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- Editor window ---------- */
  .editor-window{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 20px 60px -30px rgba(0,0,0,.7);
  }

  .titlebar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 16px;
    background:var(--panel-2);
    border-bottom:1px solid var(--line);
  }
  .dots{ display:flex; gap:6px; flex-shrink:0; }
  .dot{ width:10px; height:10px; border-radius:50%; }
  .dot-amber{ background:var(--amber); }
  .dot-mint{ background:var(--mint); }
  .dot-accent{ background:var(--accent); }

  .tab{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:var(--font-mono);
    font-size:12.5px;
    color:var(--muted);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 10px;
  }
  .tab-dot{ width:7px; height:7px; border-radius:50%; background:#F1E05A; flex-shrink:0; }

  .titlebar-spacer{ flex:1; }

  /* custom language dropdown */
  .lang-select{ position:relative; }
  .lang-trigger{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--font-sans);
    font-size:12.5px;
    font-weight:500;
    padding:6px 10px;
    border-radius:7px;
    cursor:pointer;
    transition:border-color .15s ease;
  }
  .lang-trigger:hover{ border-color:var(--muted-2); }
  .lang-trigger:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .lang-dot{ width:8px; height:8px; border-radius:50%; background:#F1E05A; flex-shrink:0; }
  .chevron{ color:var(--muted); font-size:10px; margin-left:2px; }

  .lang-menu{
    position:absolute;
    top:calc(100% + 6px);
    right:0;
    z-index:20;
    width:168px;
    margin:0;
    padding:6px;
    list-style:none;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 16px 40px -18px rgba(0,0,0,.8);
  }
  .lang-menu[hidden]{ display:none; }
  .lang-option{
    display:flex;
    align-items:center;
    gap:9px;
    padding:8px 9px;
    font-size:13px;
    border-radius:6px;
    cursor:pointer;
    color:var(--text);
  }
  .lang-option:hover, .lang-option.is-active{ background:var(--accent-soft); }
  .lang-option-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  /* ---------- Title field ---------- */
  .field-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .field-dot{
    width:8px; height:8px; border-radius:50%;
    background:#F1E05A;
    flex-shrink:0;
  }
  .title-input{
    flex:1;
    background:none;
    border:none;
    color:var(--text);
    font-family:var(--font-mono);
    font-size:14.5px;
    font-weight:500;
    padding:2px 0;
  }
  .title-input::placeholder{ color:var(--muted-2); }
  .title-input:focus{ outline:none; }
  .field-error{
    font-size:12px;
    color:var(--danger);
    display:none;
    padding:0 16px 10px;
    margin-top:-4px;
    font-family:var(--font-sans);
  }
  .field-error.is-visible{ display:block; }

  /* ---------- Code area ---------- */
  .code-area{
    display:flex;
    background:var(--panel);
  }
  .gutter{
    flex-shrink:0;
    width:44px;
    padding:14px 0;
    text-align:right;
    font-family:var(--font-mono);
    font-size:13.5px;
    line-height:1.65;
    color:var(--muted-2);
    background:var(--panel-2);
    border-right:1px solid var(--line);
    overflow:hidden;
    user-select:none;
  }
  .gutter div{ padding-right:12px; }

  .code-input{
    flex:1;
    resize:none;
    background:none;
    border:none;
    color:var(--text);
    font-family:var(--font-mono);
    font-size:13.5px;
    line-height:1.65;
    padding:14px 16px;
    min-height:170px;
    max-height:340px;
  }
  .code-input::placeholder{ color:var(--muted-2); }
  .code-input:focus{ outline:none; }

  /* ---------- Status bar (signature element) ---------- */
  .statusbar{
    display:flex;
    align-items:center;
    gap:16px;
    padding:8px 16px;
    background:var(--panel-2);
    border-top:1px solid var(--line);
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--muted);
  }
  .statusbar span{ display:flex; align-items:center; gap:6px; }
  .statusbar-spacer{ flex:1; }
  .statusbar .status-lang{ color:var(--text); }
  .status-lang-dot{ width:6px; height:6px; border-radius:50%; background:#F1E05A; }

  /* ---------- Actions ---------- */
  .actions{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:12px;
    margin-top:16px;
  }
  .kbd-hint{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--muted-2);
  }
  .kbd-hint kbd{
    font-family:inherit;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:4px;
    padding:1.5px 5px;
    color:var(--muted);
  }
  .create-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--accent);
    color:#0D0F16;
    border:none;
    font-family:var(--font-sans);
    font-weight:600;
    font-size:14px;
    padding:10px 20px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .create-btn:hover{ background:#93AEFF; box-shadow:0 8px 22px -10px rgba(124,158,255,.6); }
  .create-btn:active{ transform:translateY(1px); }
  .create-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  /* ---------- Recent snippets ---------- */
  .recent{ margin-top:52px; }
  .recent-heading{
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.6px;
    margin-bottom:14px;
  }
  .recent-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(190px,1fr));
    gap:12px;
  }
  .snippet-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    cursor:default;
    transition:transform .15s ease, border-color .15s ease;
  }
  .snippet-card:hover{ transform:translateY(-2px); border-color:var(--muted-2); }
  .card-top{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .card-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .card-title{
    font-family:var(--font-mono);
    font-size:13px;
    font-weight:600;
    color:var(--text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .card-preview{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--muted);
    background:var(--panel-2);
    border-radius:6px;
    padding:8px 9px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    margin-bottom:8px;
  }
  .card-meta{
    font-size:11px;
    color:var(--muted-2);
  }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translate(-50%, 12px);
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:13px;
    font-weight:500;
    padding:10px 16px;
    border-radius:9px;
    display:flex;
    align-items:center;
    gap:9px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    box-shadow:0 16px 40px -16px rgba(0,0,0,.7);
  }
  .toast.is-visible{ opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
  .toast-dot{ width:7px; height:7px; border-radius:50%; background:var(--mint); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  @media (max-width:520px){
    .titlebar{ flex-wrap:wrap; row-gap:8px; }
    .titlebar-spacer{ display:none; }
    .code-input{ min-height:140px; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">&lt;/&gt;</div>
      <div class="brand-name">Snippets</div>
    </div>
    <button class="logout-btn" id="logoutBtn" type="button">Log out</button>
  </div>

  <div class="editor-window">
    <div class="titlebar">
      <div class="dots">
        <span class="dot dot-amber"></span>
        <span class="dot dot-mint"></span>
        <span class="dot dot-accent"></span>
      </div>
      <div class="tab">
        <span class="tab-dot" id="tabDot"></span>
        <span id="tabLabel">untitled.js</span>
      </div>
      <div class="titlebar-spacer"></div>
      <div class="lang-select" id="langSelect">
        <button class="lang-trigger" id="langTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="lang-dot" id="langDot"></span>
          <span id="langLabel">JavaScript</span>
          <span class="chevron">⌄</span>
        </button>
        <ul class="lang-menu" id="langMenu" role="listbox" hidden>
          <li class="lang-option is-active" role="option" data-lang="JavaScript" data-ext="js" data-color="#F1E05A">
            <span class="lang-option-dot" style="background:#F1E05A"></span>JavaScript
          </li>
          <li class="lang-option" role="option" data-lang="TypeScript" data-ext="ts" data-color="#3178C6">
            <span class="lang-option-dot" style="background:#3178C6"></span>TypeScript
          </li>
          <li class="lang-option" role="option" data-lang="Python" data-ext="py" data-color="#3572A5">
            <span class="lang-option-dot" style="background:#3572A5"></span>Python
          </li>
          <li class="lang-option" role="option" data-lang="Go" data-ext="go" data-color="#00ADD8">
            <span class="lang-option-dot" style="background:#00ADD8"></span>Go
          </li>
          <li class="lang-option" role="option" data-lang="Rust" data-ext="rs" data-color="#DEA584">
            <span class="lang-option-dot" style="background:#DEA584"></span>Rust
          </li>
          <li class="lang-option" role="option" data-lang="HTML" data-ext="html" data-color="#E34C26">
            <span class="lang-option-dot" style="background:#E34C26"></span>HTML
          </li>
        </ul>
      </div>
    </div>

    <div class="field-row">
      <span class="field-dot" id="fieldDot"></span>
      <input class="title-input" id="titleInput" type="text" placeholder="Name this snippet" autocomplete="off">
    </div>
    <div class="field-error" id="titleError">Give the snippet a name before saving.</div>

    <div class="code-area">
      <div class="gutter" id="gutter"><div>1</div></div>
      <textarea class="code-input" id="codeInput" placeholder="Write or paste your code..." spellcheck="false"></textarea>
    </div>
    <div class="field-error" id="codeError">Add some code before saving — an empty snippet isn't much use.</div>

    <div class="statusbar">
      <span id="statLnCol">Ln 1, Col 1</span>
      <span id="statLines">1 line</span>
      <span id="statChars">0 chars</span>
      <div class="statusbar-spacer"></div>
      <span class="status-lang"><span class="status-lang-dot" id="statusLangDot"></span><span id="statusLangText">JavaScript</span></span>
    </div>
  </div>

  <div class="actions">
    <span class="kbd-hint"><kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>Enter</kbd> to save</span>
    <button class="create-btn" id="createBtn" type="button">Create snippet</button>
  </div>

  <div class="recent">
    <div class="recent-heading">Recent snippets</div>
    <div class="recent-grid" id="recentGrid"></div>
  </div>

</div>

<div class="toast" id="toast"><span class="toast-dot"></span><span id="toastText">Snippet created</span></div>

<script>
  const titleInput = document.getElementById('titleInput');
  const codeInput = document.getElementById('codeInput');
  const gutter = document.getElementById('gutter');
  const tabLabel = document.getElementById('tabLabel');
  const tabDot = document.getElementById('tabDot');
  const fieldDot = document.getElementById('fieldDot');
  const statLnCol = document.getElementById('statLnCol');
  const statLines = document.getElementById('statLines');
  const statChars = document.getElementById('statChars');
  const statusLangDot = document.getElementById('statusLangDot');
  const statusLangText = document.getElementById('statusLangText');
  const titleError = document.getElementById('titleError');
  const codeError = document.getElementById('codeError');
  const createBtn = document.getElementById('createBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toastText');
  const recentGrid = document.getElementById('recentGrid');

  const langTrigger = document.getElementById('langTrigger');
  const langMenu = document.getElementById('langMenu');
  const langDot = document.getElementById('langDot');
  const langLabel = document.getElementById('langLabel');

  let currentLang = { name: 'JavaScript', ext: 'js', color: '#F1E05A' };
  let toastTimer = null;

  let snippets = [
    { title: 'debounce', lang: 'JavaScript', ext: 'js', color: '#F1E05A', lines: 12, preview: 'function debounce(fn, delay) {' },
    { title: 'fetchJSON', lang: 'TypeScript', ext: 'ts', color: '#3178C6', lines: 8,  preview: 'export async function fetchJSON<T>(url: string) {' },
    { title: 'format_date', lang: 'Python', ext: 'py', color: '#3572A5', lines: 15, preview: 'def format_date(dt, fmt="%Y-%m-%d"):' }
  ];

  function renderRecent(newCardIndex){
    recentGrid.innerHTML = '';
    snippets.forEach((s, i) => {
      const card = document.createElement('div');
      card.className = 'snippet-card';
      if (i === newCardIndex) card.style.animation = 'none';
      card.innerHTML = `
        <div class="card-top">
          <span class="card-dot" style="background:${s.color}"></span>
          <span class="card-title">${escapeHtml(s.title)}.${s.ext}</span>
        </div>
        <div class="card-preview">${escapeHtml(s.preview)}</div>
        <div class="card-meta">${s.lang} · ${s.lines} line${s.lines === 1 ? '' : 's'}</div>
      `;
      recentGrid.appendChild(card);
    });
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function updateTabLabel(){
    const name = titleInput.value.trim() || 'untitled';
    tabLabel.textContent = `${name}.${currentLang.ext}`;
  }

  function updateGutter(){
    const lineCount = codeInput.value.split('\n').length;
    let html = '';
    for(let i = 1; i <= lineCount; i++){ html += `<div>${i}</div>`; }
    gutter.innerHTML = html;
    gutter.scrollTop = codeInput.scrollTop;
  }

  function updateStatus(){
    const value = codeInput.value;
    const lineCount = value.split('\n').length;
    statLines.textContent = `${lineCount} line${lineCount === 1 ? '' : 's'}`;
    statChars.textContent = `${value.length} char${value.length === 1 ? '' : 's'}`;

    const pos = codeInput.selectionStart;
    const upToCursor = value.substring(0, pos).split('\n');
    const ln = upToCursor.length;
    const col = upToCursor[upToCursor.length - 1].length + 1;
    statLnCol.textContent = `Ln ${ln}, Col ${col}`;
  }

  function applyLanguage(name, ext, color){
    currentLang = { name, ext, color };
    langDot.style.background = color;
    langLabel.textContent = name;
    tabDot.style.background = color;
    fieldDot.style.background = color;
    statusLangDot.style.background = color;
    statusLangText.textContent = name;
    updateTabLabel();

    document.querySelectorAll('.lang-option').forEach(opt => {
      opt.classList.toggle('is-active', opt.dataset.lang === name);
    });
  }

  langTrigger.addEventListener('click', () => {
    const isOpen = !langMenu.hidden;
    langMenu.hidden = isOpen;
    langTrigger.setAttribute('aria-expanded', String(!isOpen));
  });

  document.querySelectorAll('.lang-option').forEach(opt => {
    opt.addEventListener('click', () => {
      applyLanguage(opt.dataset.lang, opt.dataset.ext, opt.dataset.color);
      langMenu.hidden = true;
      langTrigger.setAttribute('aria-expanded', 'false');
    });
  });

  document.addEventListener('click', (e) => {
    if (!document.getElementById('langSelect').contains(e.target)){
      langMenu.hidden = true;
      langTrigger.setAttribute('aria-expanded', 'false');
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){
      langMenu.hidden = true;
      langTrigger.setAttribute('aria-expanded', 'false');
    }
  });

  titleInput.addEventListener('input', () => {
    updateTabLabel();
    if (titleInput.value.trim()) titleError.classList.remove('is-visible');
  });

  codeInput.addEventListener('input', () => { updateGutter(); updateStatus(); if (codeInput.value.trim()) codeError.classList.remove('is-visible'); });
  codeInput.addEventListener('click', updateStatus);
  codeInput.addEventListener('keyup', updateStatus);
  codeInput.addEventListener('scroll', () => { gutter.scrollTop = codeInput.scrollTop; });

  function showToast(msg){
    toastText.textContent = msg;
    toast.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2200);
  }

  function createSnippet(){
    const title = titleInput.value.trim();
    const code = codeInput.value.trim();
    let hasError = false;

    if (!title){ titleError.classList.add('is-visible'); hasError = true; }
    if (!code){ codeError.classList.add('is-visible'); hasError = true; }
    if (hasError) return;

    const firstLine = codeInput.value.split('\n').find(l => l.trim().length) || code;
    snippets.unshift({
      title,
      lang: currentLang.name,
      ext: currentLang.ext,
      color: currentLang.color,
      lines: codeInput.value.split('\n').length,
      preview: firstLine.trim()
    });
    renderRecent(0);

    titleInput.value = '';
    codeInput.value = '';
    updateTabLabel();
    updateGutter();
    updateStatus();
    titleInput.focus();

    showToast('Snippet created');
  }

  createBtn.addEventListener('click', createSnippet);
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter'){
      e.preventDefault();
      createSnippet();
    }
  });

  logoutBtn.addEventListener('click', () => showToast('Log out is disabled in this demo'));

  // init
  applyLanguage('JavaScript', 'js', '#F1E05A');
  renderRecent(-1);
  updateGutter();
  updateStatus();
</script>

</body>
</html>
